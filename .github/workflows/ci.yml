name: CI

on:
  push:
    branches: [main, fix]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint + Type-check + Test + Build
    runs-on: ubuntu-latest

    env:
      # JWT_SECRET bắt buộc (app refuse to start without it)
      JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      DATABASE_URL: "file:./dev.db?connection_limit=1&socket_timeout=15"
      DEMO_MODE_ENABLED: "false"
      RATE_LIMIT_DISABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
