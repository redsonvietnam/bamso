name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db?socket_timeout=5&connection_limit=1"
      JWT_SECRET: "ci-test-secret-key-not-for-production-use-xx"
      DEMO_MODE_ENABLED: "false"
      RATE_LIMIT_DISABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
